<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Nền Squircle bo tròn chuẩn macOS / Windows -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Hình trang tài liệu PDF 3D gấp góc -->
  <path d="M148 116 H300 L372 188 V396 H148 Z" fill="url(#pageGrad)" />
  <!-- Góc gấp trang -->
  <path d="M300 116 V188 H372 Z" fill="#cbd5e1" opacity="0.85" />

  <!-- Chữ biểu tượng PDFix PRO -->
  <text x="175" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#4f46e5">PDF</text>
  <text x="282" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#db2777">ix</text>

  <!-- 3 Vạch dòng văn bản mô phỏng tài liệu chuyên nghiệp -->
  <rect x="175" y="306" width="162" height="10" rx="5" fill="#94a3b8" />
  <rect x="175" y="328" width="130" height="10" rx="5" fill="#94a3b8" />
  <rect x="175" y="350" width="90" height="10" rx="5" fill="#94a3b8" />

  <!-- Huy hiệu tia sáng PRO -->
  <circle cx="366" cy="148" r="14" fill="#fbbf24" />
</svg>
